<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07110d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="ЛУНОХОД — атмосферная настольная игра-побег в Telegram" />
    <title>ЛУНОХОД</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background: #07110d;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        padding-top: env(safe-area-inset-top, var(--tg-content-safe-area-inset-top, 0px));
        padding-bottom: env(safe-area-inset-bottom, var(--tg-content-safe-area-inset-bottom, 0px));
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      /* Telegram MainButton reserve space on mobile */
      body.tg-main-button-visible {
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
